services:
  testnet15-web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=TestNET15;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Sql1Password};TrustServerCertificate=True;
    ports:
      - "${APP_HTTP_PORT:-1280}:8080"
      - "${APP_HTTPS_PORT:-1281}:8081"
